name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Neovim ${{ matrix.neovim }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        neovim: [v0.11.0, stable]
    env:
      SMART_SPLITS_DIR: ${{ github.workspace }}/.test-deps/smart-splits.nvim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install smart-splits
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: mrjones2014/smart-splits.nvim
          ref: 5fd4fe53c2df2009e689f61511e3c474a9eccbaf # v3.0.0
          path: .test-deps/smart-splits.nvim
          persist-credentials: false
      - name: Install Neovim
        uses: rhysd/action-setup-vim@febef33995d6649302e9d88dda81e071b68f16a7 # v1
        with:
          neovim: true
          version: ${{ matrix.neovim }}
      - name: Install zsh
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Unit tests
        run: nvim --headless -u NONE -i NONE -l tests/run.lua
      - name: smart-splits integration
        run: nvim --headless -u NONE -i NONE -l tests/integration.lua
      - name: Shell integration
        run: python3 tests/shell.py
